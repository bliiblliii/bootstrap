<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Baca - Login</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .card-login {
      max-width: 450px;
      width: 100%;
      border: none;
      border-radius: 8px;
    }
    .btn-success-custom {
      background-color: #198754;
      border-color: #198754;
    }
    .btn-success-custom:hover {
      background-color: #157347;
      border-color: #146c43;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-dark bg-success px-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" idnavbarNav>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Beranda</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="#">Tentang</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="#">Bantuan</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-5">
    <div class="card card-login shadow-sm p-4 bg-white">
      <div class="card-body">
        
        <div class="text-center mb-4">
          <h3 class="fw-bold text-dark">Masuk ke Ruang Baca</h3>
          <p class="text-muted small">Temukan bacaan untuk hari ini</p>
        </div>

        <form>
          <div class="mb-3">
            <label for="username" class="form-label text-secondary small">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Masukkan username" required />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label text-secondary small">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Masukkan password" required />
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label small text-secondary" for="rememberMe">Ingat saya</label>
          </div>

          <div class="d-grid mb-3">
            <button class="btn btn-success btn-success-custom text-white" type="submit">Masuk</button>
          </div>

          <div class="text-center">
            <a href="#!" class="text-decoration-none small text-success">Lupa password?</a>
          </div>
        </form>

      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
